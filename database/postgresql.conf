# ═══════════════════════════════════════════════════════════════════════════════
# PostgreSQL 16 Tuned Configuration — PeoplePay360 Enterprise Production
# ═══════════════════════════════════════════════════════════════════════════════

# Connection Settings
listen_addresses = '*'
max_connections = 100

# Memory Configuration (Tuned for 1GB-2GB RAM containers)
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Checkpoint & WAL Tuning
wal_level = replica
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min
wal_buffers = 16MB

# Query Planner & Storage Optimization (SSD / Cloud Storage)
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Parallel Query Execution
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Logging & Observability
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250    # Log slow queries taking > 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# Locale and Encoding
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
