version: '3.8'

services:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. Edge Ingress & Reverse Proxy (Nginx)
  # ═══════════════════════════════════════════════════════════════════════════
  proxy:
    image: nginx:1.27-alpine
    container_name: peoplepay360-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. Frontend React SPA Client (Static Nginx Server)
  # ═══════════════════════════════════════════════════════════════════════════
  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: peoplepay360-web
    restart: always
    expose:
      - "80"
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ═══════════════════════════════════════════════════════════════════════════
  # 3. Backend Express REST API Server (Node 20 Alpine)
  # ═══════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peoplepay360-api
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-peoplepay360}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_POOL_MIN=2
      - DB_POOL_MAX=20
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-peoplepay360-super-secret-key-32chars-min}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-peoplepay360-super-secret-refresh-key-32chars}
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.request({ host: '127.0.0.1', port: 3000, path: '/api/health', timeout: 3000 }, (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.end();"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. PostgreSQL 16 Primary Database (Tuned Performance)
  # ═══════════════════════════════════════════════════════════════════════════
  db:
    image: postgres:16-alpine
    container_name: peoplepay360-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-peoplepay360}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-peoplepay360}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. Redis 7 High-Throughput In-Memory Cache (LRU Eviction)
  # ═══════════════════════════════════════════════════════════════════════════
  cache:
    image: redis:7-alpine
    container_name: peoplepay360-cache
    restart: always
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

# ═══════════════════════════════════════════════════════════════════════════════
# Isolated Network Topology
# ═══════════════════════════════════════════════════════════════════════════════
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # Databases inaccessible from host and public internet

# ═══════════════════════════════════════════════════════════════════════════════
# Persistent Volumes
# ═══════════════════════════════════════════════════════════════════════════════
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
